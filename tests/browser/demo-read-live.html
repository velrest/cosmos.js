<!doctype html>
<meta charset="utf-8" />
<title>Live read widget test</title>
<body>
<script type="module">
  import { openAkashicRecords } from "../../src/akashic-records.js";
  import { check, run, wait } from "./harness.js";

  run(async () => {
    const records = await openAkashicRecords();
    records.save({ stars: {}, soul: { energy: 80, streak: 0 }, omen: null, nextOmenAt: null, location: null, settledAt: Date.now() });
    await records.quiet();

    // Procyon is near, bright, and always up at the north pole.
    const frame = document.createElement("iframe");
    frame.src = "../../demo/index.html?lat=90&lon=0";
    document.body.append(frame);
    for (let i = 0; i < 100 && !frame.contentDocument?.body?.hasAttribute("data-demo-ready"); i++) await wait(100);
    const page = frame.contentDocument;
    const result = page.querySelector("#read-result");

    page.querySelector("#read-star").value = "Procyon";
    page.querySelector("#read-form").requestSubmit();
    check("the widget starts empty", result.textContent.trim() === "{}");

    page.querySelector("#save-star").value = "Procyon";
    page.querySelector("#save-data").value = '{ "v": "arrived" }';
    page.querySelector("#save-form").requestSubmit();
    check("the widget doesn't change before arrival", result.textContent.trim() === "{}");

    for (let i = 0; i < 50 && !result.textContent.includes("arrived"); i++) await wait(100);
    check("the widget updates by itself on arrival", result.textContent.includes("arrived"));
  });
</script>
